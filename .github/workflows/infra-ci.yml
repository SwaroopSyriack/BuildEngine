# Terraform CI: format, validate, lint and security-scan on every infra change;
# on pull requests also run a real plan against AWS and post it as a PR comment.
name: Infra CI

on:
  pull_request:
    branches: [ "dev" ]
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
      - ".github/workflows/cd.yml"
  push:
    branches-ignore: [ "dev" ]
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
  # Lets cd.yml run the static checks before applying
  workflow_call:

permissions:
  contents: read

env:
  TF_VERSION: "1.16.6"
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    name: fmt / validate / lint / scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate (main stack)
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: terraform validate (bootstrap)
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading the AWS ruleset

      - name: shellcheck deploy script
        run: shellcheck --severity=warning scripts/app-deploy.sh

      # Blocking: CRITICAL findings (intentional exceptions are listed in infra/.trivyignore)
      - name: trivy config scan (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: CRITICAL
          trivyignores: infra/.trivyignore
          exit-code: "1"

      # Report-only: HIGH/MEDIUM findings show in the log for review
      - name: trivy config scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,MEDIUM
          trivyignores: infra/.trivyignore
          exit-code: "0"
          skip-setup-trivy: true

  plan:
    name: terraform plan
    needs: validate
    # Only for PRs from this repo: fork PRs can't get AWS credentials
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write       # OIDC -> AWS
      pull-requests: write  # plan comment
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: terraform plan
        id: plan
        # Read-only role and no lock: a PR plan must never block a deploy
        run: |
          set +e
          terraform plan -input=false -no-color -lock=false -out=tfplan > plan.log 2>&1
          code=$?
          set -e
          if [ $code -eq 0 ]; then terraform show -no-color tfplan > plan.txt; else cp plan.log plan.txt; fi
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          cat plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            let plan = fs.readFileSync('infra/plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated, see workflow logs)';
            const ok = process.env.PLAN_EXIT === '0';
            const body = `${marker}\n### Terraform plan ${ok ? '✅' : '❌ failed'}\n` +
              `<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>\n\n` +
              `_Commit ${context.sha.slice(0, 7)}, [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Fail if plan failed
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1
