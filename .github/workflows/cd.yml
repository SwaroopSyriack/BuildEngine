# CD: on every push to dev (or run manually)
#   1. app tests (ci.yml) + terraform static checks (infra-ci.yml)
#   2. terraform apply
#   3. package the app, upload to S3, deploy to the VM through SSM, smoke test
name: CD

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

# Never run two deploys at once, and never cancel one halfway through
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_VERSION: "1.16.6"
  TF_IN_AUTOMATION: "true"

jobs:
  app-tests:
    uses: ./.github/workflows/ci.yml

  infra-checks:
    uses: ./.github/workflows/infra-ci.yml
    # infra-ci's plan job (PR only, skipped here) declares these, so the caller must allow them
    permissions:
      contents: read
      id-token: write
      pull-requests: write

  terraform:
    name: terraform apply
    needs: [ app-tests, infra-checks ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    outputs:
      instance_id: ${{ steps.out.outputs.instance_id }}
      artifacts_bucket: ${{ steps.out.outputs.artifacts_bucket }}
      public_ip: ${{ steps.out.outputs.public_ip }}
      env_prefix: ${{ steps.out.outputs.env_prefix }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: terraform plan
        run: terraform plan -input=false -out=tfplan -var="aws_region=${{ vars.AWS_REGION }}"

      - name: terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Read outputs
        id: out
        run: |
          {
            echo "instance_id=$(terraform output -raw instance_id)"
            echo "artifacts_bucket=$(terraform output -raw artifacts_bucket)"
            echo "public_ip=$(terraform output -raw public_ip)"
            echo "env_prefix=$(terraform output -raw app_env_parameter_prefix)"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy app
    needs: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: http://${{ needs.terraform.outputs.public_ip }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ needs.terraform.outputs.instance_id }}
      BUCKET: ${{ needs.terraform.outputs.artifacts_bucket }}
      PUBLIC_IP: ${{ needs.terraform.outputs.public_ip }}
      VERSION: ${{ github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Package release
        # Tracked files only, so .env / data / tmp / node_modules never ship.
        # Dependencies are installed on the VM so native modules match its OS.
        run: |
          git archive --format=tar.gz -o app.tar.gz HEAD -- package.json package-lock.json packages
          ls -lh app.tar.gz

      - name: Sync app secrets to SSM
        # Each non-empty value becomes an env var for the app on the VM (<prefix><NAME>)
        env:
          PREFIX: ${{ needs.terraform.outputs.env_prefix }}
          P_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          P_JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN }}
          P_AWS_ACCESSKEYID: ${{ secrets.SITES_AWS_ACCESS_KEY_ID }}
          P_AWS_SECRETACCESSKEY: ${{ secrets.SITES_AWS_SECRET_ACCESS_KEY }}
        run: |
          for var in $(compgen -e | grep '^P_'); do
            [ -n "${!var}" ] || continue
            aws ssm put-parameter --name "${PREFIX}${var#P_}" --type SecureString \
              --value "${!var}" --overwrite > /dev/null
            echo "synced ${var#P_}"
          done

      - name: Upload release
        run: |
          aws s3 cp --only-show-errors app.tar.gz "s3://$BUCKET/releases/$VERSION/app.tar.gz"
          aws s3 cp --only-show-errors infra/scripts/app-deploy.sh "s3://$BUCKET/releases/$VERSION/app-deploy.sh"

      - name: Wait for the instance to register with SSM
        run: |
          for i in $(seq 1 60); do
            status=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' --output text)
            [ "$status" = "Online" ] && { echo "SSM agent online"; exit 0; }
            echo "waiting for SSM agent ($i): $status"; sleep 10
          done
          echo "Instance never came online in SSM" >&2; exit 1

      - name: Deploy via SSM Run Command
        run: |
          src="s3://$BUCKET/releases/$VERSION"
          cat > params.json <<EOF
          {
            "commands": [
              "set -euo pipefail",
              "export AWS_DEFAULT_REGION=$AWS_REGION",
              "cloud-init status --wait > /dev/null || true",
              "aws s3 cp --only-show-errors $src/app-deploy.sh /usr/local/bin/app-deploy",
              "chmod 755 /usr/local/bin/app-deploy",
              "/usr/local/bin/app-deploy $src/app.tar.gz $VERSION"
            ],
            "executionTimeout": ["1800"]
          }
          EOF
          cmd_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${VERSION:0:7}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $cmd_id"

          # The built-in waiter gives up after ~100s; a cold first deploy takes longer
          for i in $(seq 1 180); do
            status=$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Deploy status: $status"
          [ "$status" = "Success" ]

      - name: Mark release as current
        # The instance redeploys current/ on boot, e.g. after Terraform replaces it
        run: |
          aws s3 cp --only-show-errors "s3://$BUCKET/releases/$VERSION/app.tar.gz" "s3://$BUCKET/current/app.tar.gz"
          aws s3 cp --only-show-errors "s3://$BUCKET/releases/$VERSION/app-deploy.sh" "s3://$BUCKET/current/app-deploy.sh"
          printf '%s' "$VERSION" | aws s3 cp - "s3://$BUCKET/current/version"

      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 "http://$PUBLIC_IP/health"; then
              echo; echo "### Deployed \`${VERSION:0:7}\` to http://$PUBLIC_IP" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "http://$PUBLIC_IP/health is not responding" >&2; exit 1
